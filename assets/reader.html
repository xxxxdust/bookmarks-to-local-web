<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>
[hidden]{display:none!important}:root{--ink:#24352f;--muted:#64776d;--green:#176649;--line:#dce4da;--bg:#f5f6ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{background:#fffef9;border-bottom:1px solid var(--line);padding:27px max(24px,calc((100vw - 1320px)/2));}header .eyebrow{font-size:12px;letter-spacing:2px;color:var(--green)}h1{font-size:30px;line-height:1.35;margin:6px 0}header p{color:var(--muted);margin:8px 0 0;font-size:14px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button,input,select{font:inherit}button{cursor:pointer}nav button,.chip,.copy{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 16px;color:var(--ink)}nav button.active,.chip.active{background:var(--green);color:white;border-color:var(--green)}.shell{max-width:1320px;margin:24px auto;padding:0 24px}.toolbar{display:flex;gap:10px;margin-bottom:16px}input,select{border:1px solid var(--line);background:white;border-radius:9px;padding:11px 14px;color:var(--ink)}input{flex:1;min-width:0}select{max-width:200px}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px}.sidebar{max-height:76vh;overflow:auto;position:sticky;top:16px;padding:2px}.item{width:100%;text-align:left;display:block;padding:15px;border:1px solid transparent;border-bottom-color:var(--line);background:transparent;border-radius:9px;color:var(--ink);line-height:1.5}.item:hover{background:#eaf0e6}.item.selected{background:white;border-color:#a7bcad;box-shadow:0 2px 5px #20302008}.item small{color:var(--muted);display:block;margin-bottom:5px;font-size:11px;letter-spacing:.3px}.item strong{font-size:14px;font-weight:550}.reader{background:#fffefb;border:1px solid var(--line);border-radius:14px;padding:36px 42px;min-height:520px;overflow-wrap:anywhere}.reader h2{font-size:27px;line-height:1.5;margin:8px 0 12px}.reader h3{font-size:17px;margin:28px 0 10px}.meta,.note{color:var(--muted);font-size:13px}.lead{font-size:19px;line-height:1.8;margin:22px 0;padding-left:18px;border-left:3px solid #71a284}.reader li{margin-bottom:12px;padding-left:3px}.reader ul{padding-left:22px}.action{background:#edf3e8;border-radius:10px;padding:16px 20px}.boundary{background:#f7f2e7;border-radius:10px;padding:16px 20px;font-size:14px}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.links button{font-size:13px;padding:7px 11px;border:1px solid var(--line);background:#fff;border-radius:7px;color:var(--green)}a{color:var(--green);text-underline-offset:3px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f4ed;border:1px solid var(--line);border-radius:10px;padding:22px;font:15px/1.9 -apple-system,"PingFang SC",sans-serif}textarea{display:block;width:100%;height:300px;padding:14px;border:1px solid var(--line);font:15px/1.7 system-ui}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.stat{padding:20px;background:#edf3e8;border-radius:12px}.stat b{font-size:34px;display:block;line-height:1.1}.stat span{font-size:13px;color:var(--muted)}.routes{display:grid;grid-template-columns:1fr 1fr;gap:14px}.route{padding:20px;background:#f5f6ef;border:1px solid var(--line);border-radius:10px}.route h3{margin:0 0 8px}.route p{font-size:14px;margin:0 0 12px}.empty{padding:30px;color:var(--muted)}details{margin:20px 0}summary{cursor:pointer;color:var(--green)}.filelist{font-size:13px;max-height:450px;overflow:auto;word-break:break-word}.filelist li{margin:6px 0}.count{color:var(--muted);font-size:13px;margin:0 0 10px}.overview .reader{max-width:1040px;margin:auto}.foot{font-size:12px;color:var(--muted);margin:22px 0;text-align:center}.source-line{font-size:13px}.badge{font-size:12px;padding:3px 8px;background:#edf3e8;color:var(--green);border-radius:20px;display:inline-block}@media(max-width:820px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:300px}.reader{padding:24px}.reader h2{font-size:23px}.routes{grid-template-columns:1fr}header{padding:22px}.shell{padding:0 14px}.toolbar{flex-wrap:wrap}select{max-width:100%}.stats{gap:8px}.stat{padding:14px}.stat b{font-size:27px}}@media print{header,nav,.toolbar,.sidebar,.foot,.copy{display:none}.layout{display:block}.reader{border:0;padding:0}}
</style></head><body><header><div class="eyebrow">PERSONAL READING LIBRARY</div><h1>__TITLE__</h1><p>__SUBTITLE__</p><nav aria-label="内容栏目"><button data-tab="overview" class="active">先看总览</button><button data-tab="posts">逐篇重点 · __POSTS__</button><button data-tab="prompts">提示词 · __PROMPTS__</button><button data-tab="skills">原始资源 · __SKILLS__</button></nav></header><div class="shell"><div class="toolbar" hidden><input id="search" aria-label="搜索当前栏目" placeholder="搜索主题、作者或关键词…"><select id="category" aria-label="按类别筛选"><option value="">所有分类</option></select></div><div id="app"></div><div class="foot">本地阅读档案 · __SCOPE__</div></div><script>
const D=__DATA__;const app=document.querySelector('#app'),search=document.querySelector('#search'),cat=document.querySelector('#category');let tab='overview',selected=1;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uri=p=>p.split('/').map(encodeURIComponent).join('/');const pad=n=>String(n).padStart(2,'0');
for(const c of [...new Set(D.posts.map(p=>p.category))])cat.insertAdjacentHTML('beforeend',`<option>${esc(c)}</option>`);
function sourceLinks(ids){return ids.map(i=>{const p=D.posts.find(x=>x.id===i);return `<a href="${esc(p.url)}" target="_blank" rel="noopener">${pad(i)} · ${esc(p.author)}</a>`}).join(' / ')}
function go(t,id=1){tab=t;selected=id;search.value='';cat.value='';render();document.querySelector('.shell').scrollIntoView({block:'start'});}
function refs(p){let out='';if(p.prompts.length)out+=`<h3>可复制的提示词</h3><div class="links">${p.prompts.map(i=>`<button onclick="go('prompts',${i})">P${pad(i)} ${esc(D.prompts.find(x=>x.id===i).title)}</button>`).join('')}</div>`;if(p.skills.length)out+=`<h3>已保存的原始资源</h3><div class="links">${p.skills.map(i=>`<button onclick="go('skills',${i})">${esc(D.skills.find(x=>x.id===i).name)}</button>`).join('')}</div>`;return out}
function article(p){return `<span class="badge">${esc(p.category)}</span><h2>${pad(p.id)} · ${esc(p.title)}</h2><div class="meta">${esc(p.author)} · <a href="${esc(p.url)}" target="_blank" rel="noopener">原帖溯源 ↗</a></div><div class="lead">${esc(p.lead)}</div><ul>${p.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${p.user_note?`<h3>我的笔记</h3><p class="action">${esc(p.user_note)}</p>`:""}<h3>如何使用</h3><p class="action">${esc(p.action)}</p><h3>资源与阅读边界</h3><p class="boundary">${esc(p.resources)}</p>${refs(p)}<p class="note">${esc(p.status)}</p>`}
function prompt(p){return `<span class="badge">${esc(p.kind)} · P${pad(p.id)}</span><h2>${esc(p.title)}</h2><p class="source-line">方法来源：${sourceLinks(p.sources)}</p><p class="note">${esc(p.note)} 替换方括号里的材料后使用。</p><button class="copy" onclick="copyPrompt(${p.id},this)">复制提示词</button><pre>${esc(p.body)}</pre><p class="note">想找作者原版？到“原始资源”，展开原文件与模板。整理模板没有被自动安装为技能。</p>`}
async function copyPrompt(id,b){try{await navigator.clipboard.writeText(D.prompts.find(x=>x.id===id).body);b.textContent='已复制'}catch(e){b.textContent='请在下方选择文字复制';let r=document.createRange();r.selectNodeContents(document.querySelector('pre'));let s=window.getSelection();s.removeAllRanges();s.addRange(r)}}
function skill(s){return `<span class="badge">原始包 · S${pad(s.id)}</span><h2>${esc(s.name)}</h2><p class="meta">${esc(s.repository)}</p><div class="lead">${esc(s.use)}</div><p class="source-line">关联收藏：${sourceLinks(s.sources)}</p><div class="links"><a href="${uri(s.file)}" download>下载本地原始文件</a> · <a href="${esc(s.source)}" target="_blank" rel="noopener">原仓库 ↗</a></div><p>状态：本地文件已保存并生成校验记录；未安装、未运行。</p><p class="meta">版本：${esc(s.commit)}<br>许可识别：${esc(s.license)}，具体条款以包内原文件为准。</p><details open><summary>原始Skill、提示词与参考文件（${s.files.length}）</summary><p class="note">下列页面原样展示作者文件，内容只用于阅读。其他资产以所保存的原始文件或资源包为准。</p><ul class="filelist">${s.files.map(f=>`<li><a href="${uri(f.preview)}" target="_blank" rel="noopener">${esc(f.label)}</a></li>`).join('')}</ul></details>`}
function overview(){return `<div class="overview"><main class="reader"><span class="badge">本地收藏档案</span><h2>${esc(D.meta.title)}</h2><p>${esc(D.meta.scope)}</p>${D.meta.updated_at?`<p class="meta">最近内容更新：${esc(D.meta.updated_at)}</p>`:""}<div class="stats"><div class="stat"><b>${D.posts.length}</b><span>逐篇笔记</span></div><div class="stat"><b>${D.prompts.length}</b><span>提示词</span></div><div class="stat"><b>${D.skills.length}</b><span>原始资源包</span></div></div><h3>重点归纳</h3><ul>${D.meta.takeaways.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>阅读范围与缺失内容</h3><p class="boundary">${esc(D.meta.limitations)}</p><h3>原版与整理版</h3><p>提示词逐条标注原版或整理改写版。原始资源仅保存，不代表已安装或运行。</p><div class="links"><a href="逐篇重点.md" download>逐篇重点</a> · <a href="提示词手册.md" download>提示词手册</a> · <a href="Skill索引.md" download>资源索引</a></div></main></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelector('.toolbar').hidden=tab==='overview';cat.hidden=tab!=='posts';if(tab==='overview'){app.innerHTML=overview();return}const query=search.value.trim().toLowerCase();let items=D[tab].filter(p=>(!query||JSON.stringify(p).toLowerCase().includes(query))&&(tab!=='posts'||!cat.value||p.category===cat.value));if(!items.some(p=>p.id===selected))selected=items[0]?.id;const p=items.find(p=>p.id===selected);app.innerHTML=`<div class="layout"><aside class="sidebar"><p class="count">${items.length} 项 · ${tab==='posts'?'点击查看详细重点':tab==='prompts'?'提示词可直接复制':'原始文件与模板'}</p>${items.map(p=>`<button class="item ${p.id===selected?'selected':''}" data-item="${p.id}"><small>${tab==='posts'?pad(p.id)+' · '+esc(p.category):tab==='prompts'?'P'+pad(p.id)+' · '+esc(p.kind):'S'+pad(p.id)+' · 原始资源'}</small><strong>${esc(p.title||p.name)}</strong></button>`).join('')}</aside><main class="reader">${p?(tab==='posts'?article(p):tab==='prompts'?prompt(p):skill(p)):'<p class="empty">没有匹配结果，请换一个关键词。</p>'}</main></div>`;document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{const top=document.querySelector('.sidebar').scrollTop;selected=Number(b.dataset.item);render();document.querySelector('.sidebar').scrollTop=top})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));search.oninput=render;cat.onchange=render;render();
</script></body></html>
